name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: metoncampus_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The test setup refuses any database whose name does not end in _test.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metoncampus_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      # Railway applies committed migrations before each deploy but cannot create them. Fail here if schema.ts changed
      # without a matching migration file, instead of finding out in production.
      - name: Schema changes have a migration
        run: bun run db:check
      - name: Build web (also generates the TanStack route tree)
        run: bun run --filter @moc/web build
      - name: Typecheck
        run: bun run typecheck
      - name: API tests
        run: bun run test
      - name: Web unit tests
        run: bun run --filter @moc/web test

  # Real browsers against the real API, database and apps (apps/e2e). A separate job so `check` stays fast; it runs in parallel.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: metoncampus_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # prepare.ts refuses any database whose name does not end in _e2e.
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metoncampus_e2e
      E2E_REDIS_URL: redis://localhost:6379/13
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - name: Install the browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - name: Browser tests
        run: bun run --filter @moc/e2e test
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/e2e/playwright-report, retention-days: 7 }
