<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF9F6">
<title>You are offline · Met On Campus</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #FAF9F6; color: #141413; font-family: Inter, system-ui, 'Helvetica Neue', Arial, sans-serif; line-height: 1.5; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  .dots i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #FAF9F6; margin: 0 -3px; }
  h1 { font-size: 24px; margin: 18px 0 8px; font-family: 'Space Grotesk', system-ui, sans-serif; letter-spacing: -0.4px; }
  p { color: #57534E; margin: 0 0 22px; }
  button { font: inherit; font-weight: 600; background: #141413; color: #fff; border: 0; border-radius: 10px; height: 48px; padding: 0 24px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #141413; color: #F5F4F0; } p { color: #B9B4AA; } .dots i { border-color: #141413; } button { background: #F5F4F0; color: #141413; } }
</style>
</head>
<body>
<main>
  <div class="dots" aria-hidden="true"><i style="background:#2563EB"></i><i style="background:#059669"></i><i style="background:#E11D48"></i></div>
  <h1>You are offline</h1>
  <p>Met On Campus needs a connection to show students, chats and rooms. Check your data or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
